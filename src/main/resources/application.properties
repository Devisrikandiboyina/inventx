spring.application.name=enventx-service
spring.threads.virtual.enabled=true

# Auth is JWT-only; skip Boot's generated in-memory user until a UserDetailsService exists
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# Base64-encoded key of at least 32 bytes, supplied via environment (e.g. `openssl rand -base64 48`)
app.jwt.secret=${Kfd7g4XcGnpnN8kcg8sg5nh4nDX+KS9I/vOmSCcxahw=}
app.jwt.expiration=1h
app.jwt.issuer=inventx

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Uploads (20 MB per file; enforced again in code)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB

# MinIO object storage; credentials are supplied by the environment only (never commit them)
minio.url=${MINIO_URL:https://data.planifier.app}
minio.access-key=${MINIO_ACCESS_KEY}
minio.secret-key=${MINIO_SECRET_KEY}
minio.bucket=${MINIO_BUCKET:enggis}
minio.source-folder=${MINIO_SOURCE_FOLDER:inventx/}

# Outgoing e-mail (SMTP2GO); credentials come from the environment only
spring.mail.host=mail.smtp2go.com
spring.mail.port=2525
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=inventx@enggis.com

# WhatsApp Cloud API (template messages to opted-in numbers); leave unset to report NOT_CONFIGURED
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
whatsapp.template-name=${WHATSAPP_TEMPLATE_NAME:}
whatsapp.language-code=${WHATSAPP_LANGUAGE_CODE:en}
whatsapp.recipients=${WHATSAPP_RECIPIENTS:}
whatsapp.admin-workflow-url=${WHATSAPP_ADMIN_WORKFLOW_URL:}

# Optional ClamAV (clamd) scan of every upload; set CLAMAV_HOST to enable. When enabled, uploads fail if the scanner is down.
clamav.host=${CLAMAV_HOST:}
clamav.port=${CLAMAV_PORT:3310}
clamav.timeout-ms=${CLAMAV_TIMEOUT_MS:30000}

# MySQL (credentials from environment only)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://data.planifier.app:3306/inventx_dev?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:EagleMount__2026}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
